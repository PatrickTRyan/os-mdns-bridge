# All service actions go through mdnsbridge_ctl.php so that the CARP
# dependency is honoured no matter who asks: the GUI, the dashboard
# widget, pluginctl, HA sync or the CARP hook.

[start]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php start
parameters:
type:script
message:starting mdns-bridge

[stop]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php stop
parameters:
type:script
message:stopping mdns-bridge
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php restart
parameters:
type:script
message:restarting mdns-bridge

[status]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php status
parameters:
type:script_output
message:requesting mdns-bridge status

[carp]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php carp
parameters:
type:script
message:reconciling mdns-bridge with CARP state

[showconfig]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php showconfig
parameters:
type:script_output
message:showing generated mdns-bridge configuration

[check]
command:/usr/local/opnsense/scripts/OPNsense/MDNSBridge/mdnsbridge_ctl.php check
parameters:
type:script_output
message:checking mdns-bridge interfaces
