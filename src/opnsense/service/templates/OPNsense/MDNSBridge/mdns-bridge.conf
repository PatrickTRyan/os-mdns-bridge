{#
  Renders mdns-bridge.conf (mdns-bridge 3.1 format) from //OPNsense/MDNSBridge.

  Defensive rules, so that a later change elsewhere in OPNsense cannot
  produce a file the daemon rejects at startup:
    - interfaces that no longer exist or are disabled are skipped;
    - two entries resolving to the same device are reduced to one;
    - empty or inconsistent filter lists are skipped;
    - peer rules are only written when both ends are rendered interfaces;
    - per-interface "disable-ipvX = yes" is omitted when already global.
  Anything skipped is noted in a comment so it is visible on the
  Generated configuration tab.
-#}
{%- from 'OPNsense/Macros/interface.macro' import physical_interface -%}
{%- macro join_list(presets, filters) -%}
{%-   set items = [] -%}
{%-   for item in (presets or '').split(',') + (filters or '').split(',') -%}
{%-     if item and item not in items -%}{%- do items.append(item) -%}{%- endif -%}
{%-   endfor -%}
{{- items | join(', ') -}}
{%- endmacro -%}
{%- macro list_ok(mode, value, is_global) -%}
{%-   set items = value.split(', ') if value else [] -%}
{%-   if mode not in ['allow', 'deny'] or items | length == 0 -%}no
{%-   elif '<all>' in items and (is_global or mode != 'deny' or items | length != 1) -%}no
{%-   else -%}yes
{%-   endif -%}
{%- endmacro -%}
#
# Generated by os-mdns-bridge from the OPNsense configuration.
# Do not edit: changes are overwritten when settings are applied.
#
{% set general = OPNsense.MDNSBridge.general if helpers.exists('OPNsense.MDNSBridge.general') else {} %}
{% set ifaces = helpers.toList('OPNsense.MDNSBridge.ifaces.iface') if helpers.exists('OPNsense.MDNSBridge.ifaces.iface') else [] %}
{% set peers = helpers.toList('OPNsense.MDNSBridge.peers.peer') if helpers.exists('OPNsense.MDNSBridge.peers.peer') else [] %}
{% set global_v4_off = (general.disable_ipv4 or '0') == '1' %}
{% set global_v6_off = (general.disable_ipv6 or '0') == '1' %}
{# logical name -> device, for usable entries only #}
{% set device_of = {} %}
{% set rendered = [] %}
{% set devices = [] %}
{% for entry in ifaces %}
{%   set name = entry.interface or '' %}
{%   if (entry.enabled or '0') == '1' and name %}
{%     if not helpers.exists('interfaces.' + name + '.if') %}
# skipped interface entry "{{ name }}": it no longer exists
{%     elif (helpers.getNodeByTag('interfaces.' + name + '.enable') or '0') != '1' %}
# skipped interface entry "{{ name }}": the interface is disabled
{%     else %}
{%       set device = physical_interface(name) | trim %}
{%       if device in devices %}
# skipped interface entry "{{ name }}": device {{ device }} is already bridged
{%       elif name not in device_of %}
{%         do device_of.update({name: device}) %}
{%         do rendered.append(entry) %}
{%         do devices.append(device) %}
{%       endif %}
{%     endif %}
{%   endif %}
{% endfor %}
{% if (general.enabled or '0') == '1' and rendered | length >= 2 %}

[global]
interfaces = {{ devices | join(', ') }}
{%   if global_v4_off %}
disable-ipv4 = yes
{%   endif %}
{%   if global_v6_off %}
disable-ipv6 = yes
{%   endif %}
{%   set g_list = join_list(general.inbound_presets, general.inbound_filters) %}
{%   set g_mode = general.inbound_mode or 'none' %}
{%   if list_ok(g_mode, g_list, true) | trim == 'yes' %}
{{ g_mode }}-inbound-filters = {{ g_list }}
{%   elif g_mode != 'none' %}
# global {{ g_mode }} filter skipped: empty or invalid list
{%   endif %}
{%   for entry in rendered %}
{%     set lines = [] %}
{%     if (entry.disable_ipv4 or '0') == '1' and not global_v4_off %}
{%       do lines.append('disable-ipv4 = yes') %}
{%     endif %}
{%     if (entry.disable_ipv6 or '0') == '1' and not global_v6_off %}
{%       do lines.append('disable-ipv6 = yes') %}
{%     endif %}
{%     set in_list = join_list(entry.inbound_presets, entry.inbound_filters) %}
{%     set in_mode = entry.inbound_mode or 'none' %}
{%     if list_ok(in_mode, in_list, false) | trim == 'yes' %}
{%       do lines.append(in_mode + '-inbound-filters = ' + in_list) %}
{%     endif %}
{%     set out_list = join_list(entry.outbound_presets, entry.outbound_filters) %}
{%     set out_mode = entry.outbound_mode or 'none' %}
{%     if list_ok(out_mode, out_list, false) | trim == 'yes' %}
{%       do lines.append(out_mode + '-outbound-filters = ' + out_list) %}
{%     endif %}
{%     set seen_sources = [] %}
{%     for peer in peers %}
{%       set src = peer.source or '' %}
{%       if (peer.enabled or '0') == '1' and peer.interface == entry.interface and src in device_of and src != entry.interface and src not in seen_sources %}
{%         set p_list = join_list(peer.presets, peer.filters) %}
{%         set p_mode = peer.mode or 'allow' %}
{%         if list_ok(p_mode, p_list, false) | trim == 'yes' %}
{%           do seen_sources.append(src) %}
{%           do lines.append('peer-' + p_mode + '-outbound-filters = ' + device_of[src] + ', ' + p_list) %}
{%         endif %}
{%       endif %}
{%     endfor %}
{%     if lines %}

[{{ device_of[entry.interface] }}]
{%       if entry.description %}
# {{ entry.description | replace('\n', ' ') }}
{%       endif %}
{%       for line in lines %}
{{ line }}
{%       endfor %}
{%     endif %}
{%   endfor %}
{% else %}
# mdns-bridge is disabled, or fewer than two usable interfaces are configured.
{% endif %}
